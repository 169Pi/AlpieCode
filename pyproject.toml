[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeagent"
version = "0.1.0"
description = "Minimal installable coding-agent CLI backed by any OpenAI-compatible (e.g. vLLM) endpoint"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.30.0",
    "httpx>=0.25.0",
    "rich>=13.0",
]

[project.scripts]
codeagent = "codeagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
