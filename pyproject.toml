[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpiecode"
version = "0.3.1"
description = "AlpieCode — Autonomous AI Coding Agent CLI powered by 169Pi Alpie VLM"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.30.0",
    "httpx>=0.25.0",
    "rich>=13.0",
    "duckduckgo-search>=7.0.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
alpiecode = "codeagent.cli:main"
codeagent = "codeagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
